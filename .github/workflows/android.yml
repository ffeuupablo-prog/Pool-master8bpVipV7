
name: Build Pool Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip -q PoolMaster_Android_Prototype.zip
          cd PoolMaster
          gradle wrapper --gradle-version 8.9

      - name: Compilar APK
        run: |
          cd PoolMaster
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolMaster-APK
          path: PoolMaster/app/build/outputs/apk/debug/app-debug.apk
          
