
name: Build Pool Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer y configurar proyecto
        run: |
          unzip -q PoolMaster_Android_Prototype.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PoolMaster/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"
          replacement = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """ + marker
          if marker not in s:
              raise SystemExit("No se encontró el bloque buildFeatures")
          p.write_text(s.replace(marker, replacement, 1))
          PY
          cd PoolMaster
          gradle wrapper --gradle-version 8.9

      - name: Compilar APK
        run: |
          cd PoolMaster
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolMaster-APK
          path: PoolMaster/app/build/outputs/apk/debug/app-debug.apk
